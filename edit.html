<!doctype html>
<html lang="en-GB">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Edit deliveries · Delivery Count</title><link rel="stylesheet" href="/style.css"><script src="/date-range.js" defer></script><script src="/edit.js" defer></script></head>
<body>
<header><div class="wrap"><span class="brand">Delivery Count</span><a class="nav-link" href="/">Back to delivery tracker</a></div></header>
<main class="wrap">
<section class="intro"><h1>Edit deliveries</h1><p>Filter deliveries by box count or arrival date. Update the arrival date or total box count and save each delivery.</p></section>
<div class="filters edit-filters">
<label>Delivery Boxes<input id="boxes-filter" type="number" min="1" step="1" placeholder="e.g. 69"></label>
<div class="range-control">
<span class="range-label">Arrival date range</span>
<button id="range-toggle" class="range-toggle" type="button" aria-expanded="false" aria-controls="range-panel">Select dates</button>
<input id="date-from" type="hidden"><input id="date-to" type="hidden">
<div id="range-panel" class="range-panel" hidden>
<div class="range-presets" id="range-presets"></div>
<p id="range-help" role="status">Select a start date, then an end date.</p>
<div class="calendar-nav"><button id="range-prev" type="button" aria-label="Previous month">‹</button><span>Select arrival dates</span><button id="range-next" type="button" aria-label="Next month">›</button></div>
<div id="range-calendars" class="range-calendars"></div>
<div class="range-footer"><span id="range-preview"></span><button id="range-cancel" type="button" class="secondary">Cancel</button><button id="range-apply" type="button">Apply</button></div>
</div></div>
<button id="clear" class="secondary">Clear filters</button>
</div>
<p id="status" role="status">Loading deliveries…</p>
<div id="deliveries"></div>
</main></body></html>
